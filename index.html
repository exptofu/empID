<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Empidonax Feather Measurement Tool</title>

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div id="app">

    <div id="toolbar">

        <label
            id="openImageBtn"
            class="file-button">

            Open Image

            <input
                id="fileInput"
                type="file"
                accept="image/*">

        </label>


        <div class="separator"></div>


        <button id="panBtn">

            Pan

        </button>


        <button id="axisBtn">

            Primary Projection

        </button>


        <button id="pointBtn">

            Feather Tips

        </button>


        <button id="measureBtn">

            Measure

        </button>


        <div class="separator"></div>


        <button id="zoomOut">
            −
        </button>

        <span id="zoomLabel">
            100%
        </span>

        <button id="zoomIn">
            +
        </button>


        <button id="fitBtn">
            Fit
        </button>


        <button id="resetBtn">
            Reset
        </button>


    </div>


    <div id="workspace">

        <canvas id="canvas"></canvas>


        <div id="instructions">

            <div class="instructions-header">
                <strong>Empidonax Primary Measurement</strong>

                <button
                    id="instructionsToggle"
                    type="button"
                    aria-expanded="true"
                    aria-controls="instructionBody">
                    Collapse
                </button>
            </div>

            <div id="instructionBody">
                Load an image to begin. All processing is local and never leaves your device
            </div>

        </div>


        <div id="sidebar">

            <h3>
                Measurements
            </h3>

            <div id="measurements">

                <div class="info">
                    Open an image and Draw a Primary Projection
                    axis to begin.
                </div>

            </div>

        </div>


        <div id="status">
            No image loaded
        </div>

    </div>

</div>


<script src="js/app.js"></script>

</body>
</html>
