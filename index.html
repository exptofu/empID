<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Empidonax Feather Measurement Tool</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div id="app">

        <div id="toolbar">

            <label id="openImageBtn" class="file-button">

                <div class="icon-file-image">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-file-image-icon lucide-file-image">
                        <path
                            d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
                        <path d="M14 2v5a1 1 0 0 0 1 1h5" />
                        <circle cx="10" cy="12" r="2" />
                        <path d="m20 17-1.296-1.296a2.41 2.41 0 0 0-3.408 0L9 22" />
                    </svg>
                </div>
                <span>Open Image</span>

                <input id="fileInput" type="file" accept="image/*">

            </label>

            <button id="saveSessionBtn" type="button">
                <div class="icon-save">
                    <svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 24 24" fill="none"
                        stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-folder-bookmark-icon lucide-folder-bookmark">
                        <path d="M12 6v8l3-3 3 3V6" />
                        <path
                            d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z" />
                    </svg>
                </div>
                <span>Save Session</span>
            </button>

            <button id="loadSessionBtn" type="button">
                <div class="icon-folder-open">
                    <svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 24 24" fill="none"
                        stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-folder-tree-icon lucide-folder-tree">
                        <path
                            d="M20 10a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2.5a1 1 0 0 1-.8-.4l-.9-1.2A1 1 0 0 0 15 3h-2a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z" />
                        <path
                            d="M20 21a1 1 0 0 0 1-1v-3a1 1 0 0 0-1-1h-2.9a1 1 0 0 1-.88-.55l-.42-.85a1 1 0 0 0-.92-.6H13a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1Z" />
                        <path d="M3 5a2 2 0 0 0 2 2h3" />
                        <path d="M3 3v13a2 2 0 0 0 2 2h3" />
                    </svg>
                </div>
                <span>Load Saved Session</span>
            </button>


            <div class="separator"></div>


            <button id="panBtn">

                <div class="icon-hand">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-hand-icon lucide-hand">
                        <path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2" />
                        <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2" />
                        <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8" />
                        <path
                            d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" />
                    </svg>
                </div>
                <span>Pan</span>

            </button>


            <button id="axisBtn">

                <div class="icon-bird">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-bird-icon lucide-bird">
                        <path d="M16 7h.01" />
                        <path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20" />
                        <path d="m20 7 2 .5-2 .5" />
                        <path d="M10 18v3" />
                        <path d="M14 17.75V21" />
                        <path d="M7 18a6 6 0 0 0 3.84-10.61" />
                    </svg>
                </div>
                <span>Primary Axis</span>

            </button>


            <button id="pointBtn">

                <div class="icon-tangent">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-tangent-icon lucide-tangent">
                        <circle cx="17" cy="4" r="2" />
                        <path d="M15.59 5.41 5.41 15.59" />
                        <circle cx="4" cy="17" r="2" />
                        <path d="M12 22s-4-9-1.5-11.5S22 12 22 12" />
                    </svg>
                </div>
                <span>Feather Tips</span>

            </button>


            <button id="measureBtn">

                <div class="icon-ruler">
                    <svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 24 24" fill="none"
                        stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-ruler-icon lucide-ruler">
                        <path
                            d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z" />
                        <path d="m14.5 12.5 2-2" />
                        <path d="m11.5 9.5 2-2" />
                        <path d="m8.5 6.5 2-2" />
                        <path d="m17.5 15.5 2-2" />
                    </svg>
                </div>
                <span>Measure</span>

            </button>


            <div class="separator"></div>


            <button id="zoomOut">
                <div class="zoom-out">
                    <svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 24 24" fill="none"
                        stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-zoom-out-icon lucide-zoom-out">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" x2="16.65" y1="21" y2="16.65" />
                        <line x1="8" x2="14" y1="11" y2="11" />
                    </svg>
                </div>
                <span>Zoom Out</span>
            </button>

            <span id="zoomLabel">
                100%
            </span>

            <button id="zoomIn">
                <div class="zoom-in">
                    <svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 24 24" fill="none"
                        stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-zoom-in-icon lucide-zoom-in">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" x2="16.65" y1="21" y2="16.65" />
                        <line x1="11" x2="11" y1="8" y2="14" />
                        <line x1="8" x2="14" y1="11" y2="11" />
                    </svg>
                </div>
                <span>Zoom In</span>
            </button>


            <button id="fitBtn">
                <div class="icon-maximize-2">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15 3h6v6" />
                        <path d="M9 21H3v-6" />
                        <path d="M21 3 14 10" />
                        <path d="M3 21l7-7" />
                    </svg>
                </div>
                <span>Fit</span>
            </button>


            <button id="resetBtn">
                <div class="icon-rotate-ccw">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-rotate-ccw-icon lucide-rotate-ccw">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                        <path d="M3 3v5h5" />
                    </svg>
                </div>
                <span>Reset</span>
            </button>


        </div>


        <div id="workspace">

            <canvas id="canvas"></canvas>


            <div id="instructions">

                <div class="instructions-header">
                    <strong>Empidonax Primary Measurement</strong>

                    <button id="instructionsToggle" type="button" aria-expanded="true" aria-controls="instructionBody">
                        Collapse
                    </button>
                </div>

                <div id="instructionBody">
                    Load an image to begin. All processing is local and never leaves your device
                </div>

            </div>


            <div id="sidebar">

                <div class="sidebar-header">
                    <h3>
                        Measurements
                    </h3>

                    <button id="measurementsToggle" type="button" aria-expanded="true" aria-controls="measurements">
                        Collapse
                    </button>
                </div>

                <div id="measurements">

                    <div class="info">
                        Open an image and Draw a Primary Projection
                        axis to begin.
                    </div>

                </div>

            </div>


            <div id="status">
                No image loaded
            </div>

        </div>

    </div>

    <div id="sessionModal" class="modal hidden" aria-hidden="true">
        <div class="modal-backdrop" data-action="close-session-modal"></div>
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="sessionModalTitle">
            <div class="modal-header">
                <h3 id="sessionModalTitle">Saved Sessions</h3>
                <button type="button" class="modal-close" data-action="close-session-modal">Close</button>
            </div>
            <div id="sessionList" class="session-list"></div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
