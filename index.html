<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173f3a">
    <title>empID | Empidonax field guide</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <main class="shell">
        <header class="masthead">
            <div class="brand-mark" aria-hidden="true">
                <img src="favicon.svg" alt="">
            </div>
            <div>
                <h1>empID</h1>
            </div>
        </header>

        <nav class="main-actions" aria-label="Main tools">
            <button class="action-card active" type="button" data-view="reference" aria-controls="reference-view" aria-selected="true">
                <span class="action-number">01</span>
                <span class="action-icon" aria-hidden="true">⌕</span>
                <span class="action-title">Reference</span>
                <span class="action-description">Browse species and field marks</span>
            </button>
            <button class="action-card" type="button" data-view="quiz" aria-controls="quiz-view" aria-selected="false">
                <span class="action-number">02</span>
                <span class="action-icon" aria-hidden="true">✦</span>
                <span class="action-title">Questionnaire</span>
                <span class="action-description">Rank likely species from your observation</span>
            </button>
            <a class="action-card action-link" href="ptip.html" target="_blank" rel="noopener noreferrer" aria-label="Open Primary Tip Tool in a new tab">
                <span class="action-number">03</span>
                <span class="action-icon" aria-hidden="true">↗</span>
                <span class="action-title">Primary Tip Tool</span>
                <span class="action-description">Measure feather tips in a photo</span>
            </a>
        </nav>

        <section id="reference-view" class="view-panel" data-panel="reference" aria-labelledby="reference-title">
            <details class="field-mark-guide" open>
                <summary>Field Marks Glossary</summary>
                <div id="glossary-entries"></div>
                <figure class="p6-diagram">
                    <button class="p6-diagram-image" type="button" aria-pressed="false" aria-label="Show P6 emargination overlay">
                        <img src="images/p6_diagram.png" alt="Sample primaries of a flycatcher showing P6 emargination">
                        <img class="p6-diagram-hover" src="images/p6_diagram_hover.png" alt="">
                    </button>
                    <figcaption>Sample primaries of a flycatcher with emargination at P6. When possible, start counting at P9 as that will be the primary that is laterally the furthest when the wing is folded. Click the image to show the emarginated sections of the feathers.</figcaption>
                </figure>
            </details>
            <div class="panel-heading">
                <div>
                    <p class="kicker">Reference library</p>
                    <h2 id="reference-title">Species field marks</h2>
                </div>
                <div class="reference-filters">
                    <label class="search-field">
                        <span>Search species name</span>
                        <input id="species-filter" type="search" placeholder="Search names" autocomplete="off">
                    </label>
                    <label class="search-field">
                        <span>Filter by trait</span>
                        <select id="trait-filter">
                            <option value="">All traits</option>
                        </select>
                    </label>
                </div>
            </div>
            <div id="species-grid" class="species-grid"></div>
        </section>

        <section id="quiz-view" class="view-panel hidden" data-panel="quiz" aria-labelledby="quiz-title">
            <div class="panel-heading">
                <div>
                    <p class="kicker">Optional evidence</p>
                    <h2 id="quiz-title">Which empid fits?</h2>
                    <p class="panel-note">Answer any number of questions. Unanswered clues do not affect the ranking.</p>
                </div>
                <button id="reset-quiz" class="text-button" type="button">Reset answers</button>
            </div>
            <div id="quiz-form" class="quiz-form"></div>
            <div class="results-heading">
                <h3>Current ranking</h3>
                <span id="answer-count">0 clues selected</span>
            </div>
            <div id="quiz-results" class="quiz-results" aria-live="polite"></div>
        </section>

        <footer>
            <span>empID / working field guide</span>
            <span id="species-count"></span>
            <span id="data-source"></span>
        </footer>
    </main>
    <script src="js/index.js"></script>
</body>
</html>
